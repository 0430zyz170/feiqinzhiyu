<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>非亲之禹 - 张泽禹</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: "Microsoft YaHei", "PingFang SC", sans-serif; -webkit-tap-highlight-color: transparent; }
        body {
            background-color: #0d1f15;
            display: flex; justify-content: center; align-items: center;
            min-height: 100vh; color: #e0f2e9; padding: 10px;
        }
        #game-container {
            width: 100%; max-width: 480px;
            display: flex; flex-direction: column;
            background: linear-gradient(135deg, #1a2f22 0%, #0d1f15 100%);
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.9), 0 0 0 2px #2a4a36 inset;
            overflow: hidden;
            max-height: 95vh;
        }
        .top-section {
            position: relative; width: 100%; height: 200px;
            background-image: url('https://images.unsplash.com/photo-1518837695005-2083093ee35b?q=80&w=1000&auto=format&fit=crop');
            background-size: cover; background-position: center;
            display: flex; justify-content: center; align-items: flex-end;
            overflow: hidden; transition: filter 0.6s ease;
            flex-shrink: 0;
        }
        .top-section::before {
            content: ''; position: absolute; inset: 0;
            background: linear-gradient(to top, rgba(13,31,21,1) 0%, rgba(13,31,21,0.2) 60%, rgba(13,31,21,0.6) 100%);
            z-index: 1;
        }
        #char-img {
            position: relative; z-index: 2; max-height: 95%; max-width: 90%;
            object-fit: contain; display: none;
            filter: drop-shadow(0 0 20px rgba(0,0,0,0.8));
            transition: transform 0.5s ease;
        }
        .placeholder-text {
            position: relative; z-index: 2; color: #8ce0b0; text-align: center;
            font-size: 0.75rem; padding: 16px;
            border: 2px dashed #4a8c63; border-radius: 12px;
            background: rgba(0,0,0,0.4); backdrop-filter: blur(4px); margin-bottom: 16px;
        }
        .top-buttons {
            position: absolute; top: 10px; left: 10px; z-index: 5;
            display: flex; gap: 6px;
        }
        .btn {
            background: rgba(26, 47, 34, 0.9); border: 1px solid #4a8c63;
            color: #8ce0b0; padding: 5px 9px; border-radius: 8px;
            cursor: pointer; font-size: 0.7rem; transition: all 0.3s;
            backdrop-filter: blur(6px); white-space: nowrap;
        }
        .btn:active { background: #2a5a3a; color: #fff; }
        #status-bar {
            position: absolute; top: 10px; right: 10px; z-index: 5;
            background: rgba(13, 31, 21, 0.85); padding: 5px 10px;
            border-radius: 14px; border: 1px solid #3a6b4b;
            font-size: 0.65rem; color: #8ce0b0; backdrop-filter: blur(6px);
        }
        .bottom-section {
            width: 100%; padding: 16px 18px 20px;
            background: rgba(13, 31, 21, 0.98); border-top: 2px solid #3a6b4b;
            display: flex; flex-direction: column; gap: 10px;
            overflow-y: auto;
        }
        #speaker {
            color: #8ce0b0; font-weight: bold; font-size: 0.85rem;
            text-shadow: 0 0 10px rgba(140,224,176,0.5); letter-spacing: 0.5px;
        }
        #dialogue {
            font-size: 0.82rem; line-height: 1.7; color: #e0f2e9;
            text-shadow: 1px 1px 3px rgba(0,0,0,0.8);
            margin-bottom: 2px;
        }
        #choices { display: flex; flex-direction: column; gap: 8px; margin-top: 2px; width: 100%; }
        .choice-btn {
            width: 100%;
            background: rgba(26, 47, 34, 0.9); border: 1px solid #4a8c63;
            color: #c1e6d3; padding: 11px 13px; border-radius: 10px;
            cursor: pointer; transition: all 0.3s ease; font-size: 0.78rem;
            text-align: left; backdrop-filter: blur(4px);
            line-height: 1.5;
        }
        .choice-btn:active {
            background: #2a5a3a; border-color: #8ce0b0; color: #fff;
            transform: scale(0.98);
        }
        .choice-btn.locked {
            background: rgba(60, 20, 20, 0.9); border-color: #8b3a3a;
            color: #ffcccc; cursor: not-allowed;
            animation: pulseRed 1.5s infinite; font-weight: bold; text-align: center;
        }
        .choice-btn.locked:active { transform: none; }
        @keyframes pulseRed {
            0% { box-shadow: 0 0 0px rgba(139,58,58,0); }
            50% { box-shadow: 0 0 20px rgba(139,58,58,0.8); }
            100% { box-shadow: 0 0 0px rgba(139,58,58,0); }
        }
        #file-upload { display: none; }
        .glow-text { color: #b3ffd9; text-shadow: 0 0 15px rgba(140,224,176,0.9); }
        .heart-beat { animation: heartbeat 1.5s infinite; }
        @keyframes heartbeat {
            0% { transform: scale(1); }
            50% { transform: scale(1.01); }
            100% { transform: scale(1); }
        }
    </style>
</head>
<body>
<div id="game-container">
    <div class="top-section" id="top-section">
        <div class="top-buttons">
            <button class="btn" onclick="document.getElementById('file-upload').click()">📷 照片</button>
            <button class="btn" onclick="saveGame()">💾 存档</button>
            <button class="btn" onclick="loadGame()">📂 读档</button>
        </div>
        <div id="status-bar">好感度: <span id="favor">0</span>% | 对抗</div>
        <div class="placeholder-text" id="placeholder-text">
            点击左上角「照片」<br>上传张泽禹
        </div>
        <img id="char-img" alt="张泽禹">
    </div>
    <div class="bottom-section" id="bottom-section">
        <div id="speaker">张泽禹</div>
        <div id="dialogue">“别碰我东西。就算你妈嫁进来了，你也别想管我叫哥。”</div>
        <div id="choices"></div>
    </div>
</div>
<input type="file" id="file-upload" accept="image/*">

<script>
    let state = { favor: 0, sceneId: "start", phase: "对抗" };
    const dialogueEl = document.getElementById('dialogue');
    const speakerEl = document.getElementById('speaker');
    const choicesEl = document.getElementById('choices');
    const favorEl = document.getElementById('favor');
    const statusBar = document.getElementById('status-bar');
    const charImg = document.getElementById('char-img');
    const placeholderText = document.getElementById('placeholder-text');
    const topSection = document.getElementById('top-section');
    const bottomSection = document.getElementById('bottom-section');

    document.getElementById('file-upload').addEventListener('change', function(e) {
        const file = e.target.files[0];
        if (file) {
            const reader = new FileReader();
            reader.onload = function(event) {
                charImg.src = event.target.result;
                charImg.style.display = 'block';
                placeholderText.style.display = 'none';
            };
            reader.readAsDataURL(file);
        }
    });

    function saveGame() {
        const saveData = {
            favor: state.favor, sceneId: state.sceneId,
            imgSrc: charImg.src ? charImg.src : "",
            imgDisplay: charImg.style.display
        };
        localStorage.setItem("zhangzeyu_save", JSON.stringify(saveData));
        alert("💾 已存档！下次打开点击「读档」即可继续。");
    }

    function loadGame() {
        const saved = localStorage.getItem("zhangzeyu_save");
        if (!saved) { alert("没有找到存档，请先开始游戏并保存。"); return; }
        const data = JSON.parse(saved);
        state.favor = data.favor; state.sceneId = data.sceneId;
        if (data.imgSrc) {
            charImg.src = data.imgSrc;
            charImg.style.display = data.imgDisplay || 'block';
            placeholderText.style.display = 'none';
        }
        alert("📂 读档成功！");
        renderScene(data.sceneId);
    }

    const story = {
        start: {

            text: "“别碰我东西。就算你妈嫁进来了，你也别想管我叫哥。”\n他在林间小路上猛地回头，那头白发在绿叶中格外刺眼。他穿着黑色背心，背着登山包，眼神里满是桀骜不驯。你妈刚嫁进张家，这是你第一次和他单独相处。",
            choices: [
                { text: "“谁稀罕管你，别自作多情。”", next: "confrontation_cold", favor: 5 },
                { text: "“张泽禹，你头发上沾了树叶，我帮你拿掉。”", next: "sweet_touch", favor: 10 },
                { text: "沉默地跟上他，不管他说什么。", next: "silent_follow", favor: 2 }
            ]
        },
        confrontation_cold: {
            speaker: "张泽禹",
            text: "他愣了一下，随即冷笑：“嘴挺硬。”\n他加快步伐，像是要把你甩掉。可你发现，每次遇到陡坡，他都会悄无声息地放慢脚步。走到一处悬崖边，他忽然回头：“走不动就直说，别硬撑。”",
            choices: [
                { text: "“谁硬撑了？我好得很。”", next: "cold_stubborn", favor: 3 },
                { text: "“那你走慢点啊，我跟着呢。”", next: "cold_soften", favor: 8 }
            ]
        },
        cold_stubborn: {
            speaker: "张泽禹",
            text: "他盯着你看了两秒，眼神里闪过一丝无奈。\n“随你。”他转身继续走，但肩膀明显垮了下来。那一刻你忽然觉得，他那副嚣张的样子，可能只是怕被人看出脆弱。",
            choices: [
                { text: "追上去，拽住他的衣角。", next: "cold_chase", favor: 12 },
                { text: "继续嘴硬，各走各的。", next: "end_distant", favor: -5 }
            ]
        },
        cold_chase: {
            speaker: "张泽禹",
            text: "他脚步一顿，低头看着你拽住他衣角的手。\n“干嘛？”语气还是凶的，耳朵却红了。他没甩开你，只是闷声说：“……跟紧点，别丢了。”\n这是你们之间，第一次没有剑拔弩张的对话。",
            choices: [
                { text: "“那你以后别对我那么凶了。”", next: "sweet_tentative", favor: 10 },
                { text: "“放心，我命硬，丢不了。”", next: "sweet_tentative", favor: 5 }
            ]
        },
        cold_soften: {
            speaker: "张泽禹",
            text: "他脚步顿了一下，回头看你：“……你倒是会顺杆爬。”\n嘴上嫌弃，但他真的放慢了速度，甚至在你喘气的时候停下来假装看风景。你们之间第一次有了某种默契。",
            choices: [
                { text: "“张泽禹，你其实挺会照顾人的。”", next: "sweet_tentative", favor: 12 },

            ]
        },
        end_distant: {
            speaker: "旁白",
            text: "一路上你们再没说一句话。\n回到家，他径直回了房间，门关得很重。之后的日子，你们像两条平行线，他不再管你，你也不再招惹他。偶尔在饭桌上对视，他会先移开视线。\n有些话没说出口，就再也没机会说了。【渐行渐远·擦肩线】",
            choices: [{ text: "重新开始", next: "start", favor: 0 }]
        },
        silent_follow: {

            text: "你没回嘴，只是默默跟在他身后。\n走了一段，他忽然停下来：“你怎么不说话？”你看着他，他反倒不自在了，别开脸：“……哑巴了？”",
            choices: [
                { text: "“你不让我说话，我就不说了。”", next: "sweet_tentative", favor: 8 },
                { text: "“我在看你，你耳根红了。”", next: "sweet_touch", favor: 12 }
            ]
        },
        sweet_touch: {
            speaker: "张泽禹",
            text: "你伸手，指尖碰到他蓬松的白发，轻轻把那片绿叶拿下来。\n他整个人僵住了，耳朵肉眼可见地变红。“你……”他想说什么，却卡在喉咙里。山风吹过，你们之间的距离近得能听见彼此的呼吸。",
            choices: [
                { text: "“好了，拿掉了。”转身假装若无其事。", next: "sweet_tentative", favor: 8 },
                { text: "“张泽禹，你脸红什么？”", next: "sweet_tease", favor: 12 }
            ]
        },
        sweet_tease: {
            speaker: "张泽禹",
            text: "“谁脸红了？你眼睛有问题。”他嘴上不承认，却一把抓住你还没收回的手腕。\n掌心很烫。“……别乱碰我。”他说得很凶，但手指没有松开。",
            choices: [
                { text: "“那你先放开我啊。”", next: "sweet_handhold", favor: 10 },

            ]
        },
        sweet_handhold: {
            speaker: "张泽禹",
            text: "他低头看着你们交握的手，沉默了很久。\n“……你知道你在干什么吗？”他声音有点哑。你点头，他忽然笑了，是那种第一次真正放松的笑。“行，那你别后悔。”",
            choices: [
                { text: "“不后悔。”", next: "sweet_camp", favor: 12 },
                { text: "“你先别得意，看表现。”", next: "sweet_camp", favor: 8 }
            ]
        },
        sweet_tentative: {
            speaker: "张泽禹",
            text: "天色渐暗，你们在山上露营。他递给你一杯热水，眼神飘忽：“老头让我照顾你，别多想。”\n火光映着他的侧脸。那个对你冷言冷语的人，此刻正悄悄把外套披在你肩上。",
            choices: [
                { text: "“张泽禹，你是不是有点喜欢我？”", next: "sweet_confess", favor: 15 },
                { text: "默默靠在他肩上，享受这份静谧。", next: "sweet_lean", favor: 10 }
            ]
        },
        sweet_lean: {
            speaker: "张泽禹",
            text: "你靠在他肩上，他身体僵了一瞬，却没有推开你。\n过了很久，他低声说：“……就这一次。”可他没动，任由你靠着，连呼吸都放轻了。",
            choices: [
                { text: "“以后也可以吗？”", next: "sweet_confess", favor: 12 },
                { text: "“嗯，就这一次。”", next: "sweet_confess", favor: 6 }
            ]
        },
        sweet_confess: {
            speaker: "张泽禹",
            text: "“喜欢？”他重复了一遍这个词，像是第一次认真思考。\n然后他转过头，认真地看你：“我不知道那算不算喜欢。但你要是不在了，我会很难受。”\n他低下头，凑近你的唇。这是一个笨拙又青涩的吻，带着山间草木的味道。",
            choices: [
                { text: "回吻他，双手环住他的脖子。", next: "sweet_kiss_deep", favor: 18 },

        sweet_kiss_deep: {

            choices: [
                { text: "“我不会离开你的，你冷静点。”", next: "obsession_calm", favor: 12 },
                { text: "“你翻我手机？你太过分了！”", next: "obsession_break", favor: -10 },
                { text: "抱住他：“我哪也不去。”", next: "obsession_hug", favor: 20 }

        obsession_calm: {

            choices: [
                { text: "“我不怕你。”", next: "obsession_lock", favor: 15 },

        obsession_trust: {

        end_elope: {
            speaker: "旁白",
            text: "你去找他，在小镇的河边找到蹲着的他。\n“我以为你走了。”他声音沙哑。你蹲下来，握住他的手：“我们一起走。”\n你们离开了家，去了一个谁也不认识的地方。日子很苦，但他在清晨吻你时的温柔，让你觉得一切都值得。【私奔线·此生共渡】",
            choices: [{ text: "重新开始", next: "start", favor: 0 }]
        },
        end_married: {
            speaker: "旁白",
            text: "你的顺从让他冷静下来。他跪在你面前，拿出一枚准备好的戒指。\n“我知道我不够好，但我会用一辈子去证明。”\n你们的爱情最终得到了家人的祝福。婚礼那天，他穿着西装，眼神里再没有戾气，只有深情。洞房花烛夜，他吻着你，轻声说：“老婆，终于名正言顺了。”【明媒正娶·结婚线】",
            choices: [{ text: "重新开始", next: "start", favor: 0 }]
        }
    };

    function renderScene(sceneId) {
        const scene = story[sceneId];
        if (!scene) return;
        state.sceneId = sceneId;

        if (scene.favor !== undefined) {
            state.favor += scene.favor;
            if (state.favor < 0) state.favor = 0;
            if (state.favor > 100) state.favor = 100;
            favorEl.textContent = state.favor;
        }

        if (sceneId === "obsession_break" && state.favor >= 60) {
            scene.choices = [{ text: "“张泽禹，你这样我们都会痛苦。”", next: "end_let_go", favor: 0 }];
        }
        if (sceneId === "obsession_trust") {
            if (state.favor >= 80) {
                scene.choices = [{ text: "“我们一起去看医生吧。”", next: "end_salvation", favor: 10 }];
            } else {
                scene.choices = [
                    { text: "“我信你。”", next: "end_married", favor: 15 },
                    { text: "“我们慢慢来。”", next: "end_elope", favor: 5 }
                ];
            }
        }

        if (state.favor < 30) {
            state.phase = "对抗";
            statusBar.innerHTML = `好感度: ${state.favor}% | 对抗`;
            topSection.style.filter = "brightness(0.9) hue-rotate(30deg)";
        } else if (state.favor < 70) {
            state.phase = "甜蜜";
            statusBar.innerHTML = `好感度: ${state.favor}% | 甜蜜`;
            topSection.style.filter = "brightness(1) hue-rotate(20deg) saturate(1.1)";
        } else {
            state.phase = "占有";
            statusBar.innerHTML = `好感度: ${state.favor}% | 占有`;
            topSection.style.filter = "brightness(0.7) hue-rotate(50deg) contrast(1.2)";
        }

        speakerEl.textContent = scene.speaker;
        dialogueEl.textContent = scene.text;

        if (sceneId.includes("end")) {
            dialogueEl.classList.add("glow-text");
            bottomSection.classList.add("heart-beat");
        } else {
            dialogueEl.classList.remove("glow-text");
            bottomSection.classList.remove("heart-beat");
        }

        choicesEl.innerHTML = '';
        scene.choices.forEach(choice => {
            const btn = document.createElement('button');
            btn.className = 'choice-btn';
            if (choice.locked) {
                btn.classList.add('locked');
                if (scene.choices.length === 1) {
                    btn.style.animation = "pulseRed 1.5s infinite";
                }
            }
            btn.textContent = choice.text;
            btn.onclick = () => {
                if (choice.favor !== undefined) {
                    state.favor += choice.favor;
                    if (state.favor < 0) state.favor = 0;
                    if (state.favor > 100) state.favor = 100;
                    favorEl.textContent = state.favor;
                }
                renderScene(choice.next);
            };
            choicesEl.appendChild(btn);
        });

        setTimeout(() => {
            bottomSection.scrollTop = bottomSection.scrollHeight;
        }, 50);
    }

    renderScene(state.sceneId);
</script>
</body>
</html>
